name: Electron Build

permissions:
  contents: "read"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          npm ci
      - name: Build executable
        run: |
          npm run build
      - name: Copy additional files
        shell: bash
        run: |
          cp -R frontend dist/frontend
          cp example.env dist/.env
      - name: Compress archive (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          $staging = "zip-staging"
          Remove-Item $staging -Recurse -Force -ErrorAction Ignore
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item -Path ./dist/* -Destination $staging -Recurse
          Get-ChildItem $staging -Recurse -Directory | Where-Object {
            $_.Name -like "*-unpacked"
          } | Remove-Item -Recurse -Force
          Compress-Archive -Path "$staging/*" -DestinationPath Stagetimer-${{ matrix.os }}.zip -Force
      - name: Compress archive (Ubuntu and Mac)
        if: startsWith(matrix.os, 'ubuntu') || startsWith(matrix.os, 'macos')
        run: |
          cd dist
          zip -r ../Stagetimer-${{ matrix.os }}.zip . -x '*-unpacked/*'
      - name: Upload artifact (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Stagetimer-Windows
          path: Stagetimer-windows-latest.zip
      - name: Upload artifact (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Stagetimer-Linux
          path: Stagetimer-ubuntu-latest.zip
      - name: Upload artifact (Mac)
        if: startsWith(matrix.os, 'macos')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Stagetimer-Mac
          path: Stagetimer-macos-latest.zip
  create-release:
    needs: [build]
    permissions:
      contents: "write"
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout Code
        with:
          fetch-depth: 0 # allows for tags access
          persist-credentials: true # Required to update the nightly-build tag.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        name: Download artifacts
        with:
          path: release-artifacts/
          merge-multiple: true
      - name: Rename archives
        run: |
          mv release-artifacts/Stagetimer-windows-latest.zip release-artifacts/Stagetimer-Windows.zip
          mv release-artifacts/Stagetimer-ubuntu-latest.zip release-artifacts/Stagetimer-Linux.zip
          mv release-artifacts/Stagetimer-macos-latest.zip release-artifacts/Stagetimer-Mac.zip
      - name: Create release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          replacesArtifacts: true
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: "release-artifacts/*"
          body: ${{ github.event.head_commit.message }}
          prerelease: true
          name: Nightly Release
          tag: nightly-build
      - name: Update nightly-build tag
        run: |
          git tag -f nightly-build
          git push -f origin nightly-build
        shell: bash
